name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: generate activity.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ADIkaprojects
          outputs: |
            assets/activity.svg?palette=github-dark

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "chore: update github contribution snake [skip ci]" || exit 0
          git push
