    <!-- Row 5: 2026 -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="1320" height="40" rx="6" fill="#ffffff" fill-opacity=".02"/>
      <text x="50" y="25" font-family="monospace" font-size="16" font-weight="700" fill="#f4f4f5" opacity=".85">2026</text>
      <text x="120" y="25" font-family="sans-serif" font-size="16" fill="#f4f4f5" opacity=".85"><tspan font-weight="700">Multimodal RAG</tspan> — 10K+ PDFs · hybrid retrieval · local vision</text>
