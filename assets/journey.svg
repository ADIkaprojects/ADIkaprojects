<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="320" rx="18" fill="#0d1117"/>
  <rect width="1400" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1400" height="320" rx="18" fill="url(#glow)"/>

  <!-- Content -->
  <g transform="translate(40, 30)">
    
    <!-- Row 1: 2023 -->
    <g transform="translate(0, 0)">
