      <text x="120" y="25" font-family="sans-serif" font-size="16" fill="#f4f4f5" opacity=".85"><tspan font-weight="700">Chitkara · B.Tech AI/ML</tspan> — Formal study of intelligent systems · CGPA 9.25</text>
    </g>

