      <text x="50" y="25" font-family="monospace" font-size="16" font-weight="700" fill="#f4f4f5" opacity=".85">2024</text>
      <text x="120" y="25" font-family="sans-serif" font-size="16" fill="#f4f4f5" opacity=".85"><tspan font-weight="700">Smart India Hackathon</tspan> — National Finalist · multi-hazard RAG assistant</text>
    </g>
    
    <!-- Row 3: 2024 (Empathetic AI) -->
    <g transform="translate(0, 100)">
