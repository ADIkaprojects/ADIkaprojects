<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="120" viewBox="0 0 1400 120">
  <defs>
    <!-- Glowing dot -->
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" ease="ease-in-out"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  
  <rect width="1400" height="120" rx="18" fill="#0d1117"/>
  <rect width="1400" height="120" rx="18" fill="#ffffff" fill-opacity=".01"/>
  
  <line x1="40" y1="20" x2="1360" y2="20" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>
  
  <g font-family="monospace" font-size="12" fill="#f4f4f5" letter-spacing="3">
    <text x="40" y="65" opacity=".75">ARP · V2026.6</text>
    <text x="40" y="90" opacity=".35">© 2026 ARYAN RUDR PANDIT</text>
  </g>
  
  <g font-family="monospace" font-size="12" fill="#f4f4f5" letter-spacing="3" text-anchor="middle">
    <text x="700" y="65" opacity=".55">BUILT · DESIGNED · SHIPPED</text>
  </g>
  
  <g font-family="monospace" font-size="12" fill="#f4f4f5" letter-spacing="3" text-anchor="end">
    <text x="1335" y="65" opacity=".75">SYSTEM ONLINE</text>
    <circle cx="1355" cy="61" r="5" fill="url(#dot-glow)"/>
  </g>
</svg>
