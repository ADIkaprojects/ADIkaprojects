<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="420" rx="18" fill="#0d1117"/>
  <rect width="1400" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1400" height="420" rx="18" fill="url(#glow)"/>

  <!-- Content -->
  <g transform="translate(30, 30)">
    
    <!-- Top Row -->
    <g transform="translate(10, 0)">
      
      <!-- Card 1 -->
      <rect x="0" y="0" width="650" height="170" rx="12" fill="#ffffff" fill-opacity=".02"/>
      <text x="30" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#f4f4f5">01 / MULTIMODAL RAG <tspan font-family="monospace" font-size="12" opacity=".55">2026</tspan></text>
      <text x="30" y="70" font-family="sans-serif" font-size="16" font-style="italic" fill="#f4f4f5" opacity=".75">Local-first document intelligence</text>
      <text x="30" y="105" font-family="sans-serif" font-size="15" fill="#f4f4f5" opacity=".85">Production pipeline for 10,000+ PDFs with hybrid BM25 + FAISS retrieval,</text>
      <text x="30" y="125" font-family="sans-serif" font-size="15" fill="#f4f4f5" opacity=".85">HyDE expansion, local LLaMA 3.2-Vision captioning, and CLIP cross-modal search.</text>
      <g transform="translate(30, 140)">
        <rect x="0" y="0" width="70" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="35" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">FastAPI</text>
        <rect x="75" y="0" width="55" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="102.5" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">FAISS</text>
        <rect x="135" y="0" width="50" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="160" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">BM25</text>
        <rect x="190" y="0" width="50" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="215" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">CLIP</text>
        <rect x="245" y="0" width="85" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="287.5" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">LLaMA-3.2-V</text>
      </g>
      
      <!-- Card 2 -->
      <rect x="670" y="0" width="650" height="170" rx="12" fill="#ffffff" fill-opacity=".02"/>
      <text x="700" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#f4f4f5">02 / CONFIDO <tspan font-family="monospace" font-size="12" opacity=".55">2025</tspan></text>
      <text x="700" y="70" font-family="sans-serif" font-size="16" font-style="italic" fill="#f4f4f5" opacity=".75">AI interview analysis</text>
      <text x="700" y="105" font-family="sans-serif" font-size="15" fill="#f4f4f5" opacity=".85">NLP evaluation system that turns interview transcripts into structured feedback</text>
      <text x="700" y="125" font-family="sans-serif" font-size="15" fill="#f4f4f5" opacity=".85">using semantic similarity, scoring logic, and Firebase session memory.</text>
      <g transform="translate(700, 140)">
        <rect x="0" y="0" width="60" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="30" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">Python</text>
        <rect x="65" y="0" width="40" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="85" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">NLP</text>
        <rect x="110" y="0" width="75" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="147.5" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">Firebase</text>
        <rect x="190" y="0" width="50" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="215" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">REST</text>
      </g>

    </g>

    <!-- Bottom Row -->
    <g transform="translate(10, 190)">
      
      <!-- Card 3 -->
      <rect x="0" y="0" width="650" height="170" rx="12" fill="#ffffff" fill-opacity=".02"/>
      <text x="30" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#f4f4f5">03 / EMPATHETIC AI <tspan font-family="monospace" font-size="12" opacity=".55">2024</tspan></text>
      <text x="30" y="70" font-family="sans-serif" font-size="16" font-style="italic" fill="#f4f4f5" opacity=".75">Fine-tuned LLM + emotion</text>
      <text x="30" y="105" font-family="sans-serif" font-size="15" fill="#f4f4f5" opacity=".85">Fine-tuned TinyLLaMA 1.1B on conversational data with a</text>
      <text x="30" y="125" font-family="sans-serif" font-size="15" fill="#f4f4f5" opacity=".85">multimodal emotion pipeline for adaptive responses.</text>
      <g transform="translate(30, 140)">
        <rect x="0" y="0" width="85" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="42.5" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">TinyLLaMA</text>
        <rect x="90" y="0" width="65" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="122.5" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">PyTorch</text>
        <rect x="160" y="0" width="95" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="207.5" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">Transformers</text>
        <rect x="260" y="0" width="60" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="290" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">OpenCV</text>
      </g>
      
      <!-- Card 4 -->
      <rect x="670" y="0" width="650" height="170" rx="12" fill="#ffffff" fill-opacity=".02"/>
      <text x="700" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#f4f4f5">04 / SMART COUNCIL <tspan font-family="monospace" font-size="12" opacity=".55">2024</tspan></text>
      <text x="700" y="70" font-family="sans-serif" font-size="16" font-style="italic" fill="#f4f4f5" opacity=".75">Multi-LLM reasoning</text>
      <text x="700" y="105" font-family="sans-serif" font-size="15" fill="#f4f4f5" opacity=".85">Flask multi-agent framework for prompt-driven argument generation</text>
      <text x="700" y="125" font-family="sans-serif" font-size="15" fill="#f4f4f5" opacity=".85">and structured scoring of reasoning quality across panels.</text>
      <g transform="translate(700, 140)">
        <rect x="0" y="0" width="50" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="25" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">Flask</text>
        <rect x="55" y="0" width="50" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="80" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">LLMs</text>
        <rect x="110" y="0" width="60" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="140" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">Agents</text>
        <rect x="175" y="0" width="130" height="20" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="240" y="14" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".75">Prompt Engineering</text>
      </g>

    </g>

  </g>
</svg>
