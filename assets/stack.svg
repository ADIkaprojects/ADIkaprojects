      <rect x="285" y="8" width="55" height="24" rx="4" fill="#ffffff" fill-opacity=".05"/><text x="312.5" y="24" text-anchor="middle" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".75">ReAct</text>
