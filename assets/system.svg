<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="260" viewBox="0 0 1400 260">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="260" rx="18" fill="#0d1117"/>
  <rect width="1400" height="260" rx="18" fill="url(#grid)"/>
  <rect width="1400" height="260" rx="18" fill="url(#glow)"/>

  <!-- Row 1: Metrics -->
  <g transform="translate(30, 30)">
    <!-- Card background subtle -->
    <rect x="0" y="0" width="245" height="90" rx="12" fill="#ffffff" fill-opacity=".02"/>
    <text x="30" y="40" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">TOK/S</text>
    <text x="30" y="70" font-family="sans-serif" font-weight="700" font-size="24" fill="#f4f4f5">184</text>
    <circle cx="215" cy="35" r="4" fill="#f4f4f5" opacity=".8"/>
    
    <rect x="270" y="0" width="245" height="90" rx="12" fill="#ffffff" fill-opacity=".02"/>
    <text x="300" y="40" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">CTX</text>
    <text x="300" y="70" font-family="sans-serif" font-weight="700" font-size="24" fill="#f4f4f5">128K</text>
    
    <rect x="540" y="0" width="245" height="90" rx="12" fill="#ffffff" fill-opacity=".02"/>
    <text x="570" y="40" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">EMB</text>
    <text x="570" y="70" font-family="sans-serif" font-weight="700" font-size="24" fill="#f4f4f5">1536</text>
    
    <rect x="810" y="0" width="245" height="90" rx="12" fill="#ffffff" fill-opacity=".02"/>
    <text x="840" y="40" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">REASON</text>
    <text x="840" y="70" font-family="sans-serif" font-weight="700" font-size="24" fill="#f4f4f5">0.97</text>
    
    <rect x="1080" y="0" width="260" height="90" rx="12" fill="#ffffff" fill-opacity=".02"/>
    <text x="1110" y="40" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">FPS</text>
    <text x="1110" y="70" font-family="sans-serif" font-weight="700" font-size="24" fill="#f4f4f5">60</text>
  </g>

  <!-- Row 2: Models & Retrieval -->
  <g transform="translate(30, 140)">
    <!-- Main Model -->
    <rect x="0" y="0" width="410" height="90" rx="12" fill="#ffffff" fill-opacity=".02"/>
    <text x="30" y="40" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">MODEL</text>
    <text x="30" y="70" font-family="sans-serif" font-weight="600" font-size="18" fill="#f4f4f5">LLaMA 3.2 Vision</text>

    <!-- Connective Dash -->
    <line x1="435" y1="45" x2="455" y2="45" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>

    <!-- Retrieval Pipeline -->
    <rect x="480" y="0" width="430" height="90" rx="12" fill="#ffffff" fill-opacity=".02"/>
    <text x="510" y="40" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">RETRIEVAL</text>
    <text x="510" y="70" font-family="sans-serif" font-weight="600" font-size="18" fill="#f4f4f5">FAISS + BM25</text>
    
    <!-- Methods -->
    <rect x="940" y="0" width="400" height="90" rx="12" fill="#ffffff" fill-opacity=".02"/>
    <text x="970" y="40" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">METHOD</text>
    <text x="970" y="70" font-family="sans-serif" font-weight="600" font-size="18" fill="#f4f4f5">HyDE · CLIP · Local-first AI</text>
  </g>
</svg>
