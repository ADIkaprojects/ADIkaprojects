<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- Glowing dot for open channel -->
    <radialGradient id="channel-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="340" rx="18" fill="#0d1117"/>
  <rect width="1400" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1400" height="340" rx="18" fill="url(#glow)"/>

  <!-- Console container -->
  <g transform="translate(40, 40)">
    
    <!-- Top Header -->
    <text x="10" y="20" font-family="monospace" font-size="14" fill="#f4f4f5" opacity=".55" letter-spacing="3">CHANNEL</text>
    <circle cx="120" cy="15" r="5" fill="url(#channel-pulse)"/>
    <text x="140" y="20" font-family="monospace" font-size="14" fill="#f4f4f5" opacity=".85" letter-spacing="3" font-weight="700">OPEN</text>

    <!-- Decorative Top Line -->
    <line x1="220" y1="15" x2="1300" y2="15" stroke="#ffffff" stroke-opacity=".15" stroke-width="1" stroke-dasharray="4 6"/>

    <!-- Content Columns -->
    <!-- Column 1: EMAIL & LOCATION -->
    <g transform="translate(10, 90)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">PRIMARY</text>
      <text x="0" y="30" font-family="sans-serif" font-size="22" font-weight="600" fill="#f4f4f5">aryanrudr911@gmail.com</text>
      
      <text x="0" y="100" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">LOCATION</text>
      <text x="0" y="130" font-family="monospace" font-size="16" fill="#f4f4f5" letter-spacing="2">CHANDIGARH · INDIA</text>
    </g>

    <!-- Column 2: NETWORK -->
    <g transform="translate(500, 90)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">NETWORK</text>
      
      <text x="0" y="35" font-family="monospace" font-size="15" fill="#f4f4f5">GitHub</text>
      <text x="120" y="35" font-family="monospace" font-size="15" fill="#f4f4f5" opacity=".65">@ADIkaprojects</text>
      <text x="320" y="35" font-family="monospace" font-size="15" fill="#f4f4f5" opacity=".85">↗</text>

      <text x="0" y="80" font-family="monospace" font-size="15" fill="#f4f4f5">LinkedIn</text>
      <text x="120" y="80" font-family="monospace" font-size="15" fill="#f4f4f5" opacity=".65">Aryan Rudr Pandit</text>
      <text x="320" y="80" font-family="monospace" font-size="15" fill="#f4f4f5" opacity=".85">↗</text>

      <text x="0" y="125" font-family="monospace" font-size="15" fill="#f4f4f5">Portfolio</text>
      <text x="120" y="125" font-family="monospace" font-size="15" fill="#f4f4f5" opacity=".65">aryanrudrpandit.dev</text>
      <text x="320" y="125" font-family="monospace" font-size="15" fill="#f4f4f5" opacity=".85">↗</text>
    </g>

    <!-- Column 3: STATUS -->
    <g transform="translate(980, 90)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#f4f4f5" opacity=".55" letter-spacing="2">STATUS</text>
      <text x="0" y="30" font-family="monospace" font-size="12" fill="#f4f4f5" opacity="0.4" letter-spacing="1">AVAILABLE FOR:</text>
      
      <!-- Tags - Using subtle white bg instead of colored -->
      <rect x="0" y="50" width="80" height="26" rx="4" fill="#ffffff" fill-opacity=".05"/>
      <text x="40" y="67" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".85">AI / ML</text>
      
      <rect x="90" y="50" width="110" height="26" rx="4" fill="#ffffff" fill-opacity=".05"/>
      <text x="145" y="67" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".85">LLM SYSTEMS</text>
      
      <rect x="0" y="90" width="50" height="26" rx="4" fill="#ffffff" fill-opacity=".05"/>
      <text x="25" y="107" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".85">RAG</text>
      
      <rect x="60" y="90" width="100" height="26" rx="4" fill="#ffffff" fill-opacity=".05"/>
      <text x="110" y="107" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".85">AGENTIC AI</text>
      
      <rect x="0" y="130" width="170" height="26" rx="4" fill="#ffffff" fill-opacity=".05"/>
      <text x="85" y="147" text-anchor="middle" font-family="monospace" font-size="11" fill="#f4f4f5" opacity=".85">CREATIVE TECHNOLOGY</text>
    </g>
  </g>
</svg>
