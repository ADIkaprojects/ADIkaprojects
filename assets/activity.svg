<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="240" viewBox="0 0 1400 240">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity=".03" stroke-width="1"/>
    </pattern>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1400" height="240" rx="6" fill="#0d1117"/>
  <rect width="1400" height="240" rx="6" fill="url(#grid)"/>

  <g transform="translate(700, 100)" text-anchor="middle">
    <circle cx="0" cy="0" r="8" fill="url(#pulse)"/>
    <text x="0" y="35" font-family="monospace" font-size="14" fill="#8b949e" letter-spacing="3">AWAITING GITHUB SIGNAL</text>
    <text x="0" y="55" font-family="sans-serif" font-size="12" fill="#8b949e" opacity="0.6">Run the 'generate snake' GitHub Action to populate this graph.</text>
  </g>
</svg>
